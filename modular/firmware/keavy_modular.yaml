substitutions:
  device_name: "keavy-modular-plc"
  friendly_name: "KEAVY Modular PLC (Brain + Relay16 + Dimmer6)"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "KEAVY Modular DIN-Rail System: KEAVY-BRAIN + KEAVY-RELAY16 (0x20) + KEAVY-DIMMER6 (0x40)"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Wired LAN / Ethernet on KEAVY-BRAIN (W5500 SPI)
ethernet:
  type: W5500
  clk_pin: GPIO14
  mosi_pin: GPIO26
  miso_pin: GPIO25
  cs_pin: GPIO27
  interrupt_pin: GPIO33
  reset_pin: GPIO32

web_server:
  port: 80

# KEAVY-BUS I2C Backplane (SDA=GPIO21, SCL=GPIO22)
# 100kHz recommended for maximum EMI immunity inside industrial relay/dimmer panels
i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 100kHz

# Module 1: KEAVY-RELAY16 (DIP SW1 = OFF-OFF-OFF -> 0x20)
# Module 3: KEAVY-INPUT12A4 (DIP SW1 = OFF-OFF-ON  -> 0x24, 12-CH Opto-Isolated Digital Inputs + BUS_INT)
mcp23017:
  - id: relay_mod1
    address: 0x20
  - id: input_mod1
    address: 0x24

# Module 3 (Analog Stage): KEAVY-INPUT12A4 16-bit 4-CH 0-10V ADC (TI ADS1115 at 0x48)
ads1115:
  - id: adc_mod1
    address: 0x48
    continuous_mode: off

# Module 2: KEAVY-DIMMER6 (DIP SW1 = OFF-OFF-OFF -> 0x40)
# To chain a 2nd Dimmer6 module, set SW1 = ON-OFF-OFF -> address: 0x41
pca9685:
  - id: dimmer_mod1
    address: 0x40
    frequency: 1526 # Max PCA9685 PWM frequency (flicker-free)

# 6-Channel LED Dimmer Outputs (PCA9685 Channels 0..5)
output:
  - { platform: pca9685, pca9685_id: dimmer_mod1, channel: 0, id: dim1_ch1 }
  - { platform: pca9685, pca9685_id: dimmer_mod1, channel: 1, id: dim1_ch2 }
  - { platform: pca9685, pca9685_id: dimmer_mod1, channel: 2, id: dim1_ch3 }
  - { platform: pca9685, pca9685_id: dimmer_mod1, channel: 3, id: dim1_ch4 }
  - { platform: pca9685, pca9685_id: dimmer_mod1, channel: 4, id: dim1_ch5 }
  - { platform: pca9685, pca9685_id: dimmer_mod1, channel: 5, id: dim1_ch6 }

light:
  - { platform: monochromatic, name: "Dimmer 1", output: dim1_ch1, gamma_correct: 2.8, default_transition_length: 600ms, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: monochromatic, name: "Dimmer 2", output: dim1_ch2, gamma_correct: 2.8, default_transition_length: 600ms, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: monochromatic, name: "Dimmer 3", output: dim1_ch3, gamma_correct: 2.8, default_transition_length: 600ms, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: monochromatic, name: "Dimmer 4", output: dim1_ch4, gamma_correct: 2.8, default_transition_length: 600ms, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: monochromatic, name: "Dimmer 5", output: dim1_ch5, gamma_correct: 2.8, default_transition_length: 600ms, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: monochromatic, name: "Dimmer 6", output: dim1_ch6, gamma_correct: 2.8, default_transition_length: 600ms, restore_mode: RESTORE_DEFAULT_OFF }

# 16-Channel NPN Relay Driver Switches (MCP23017 Port B = 8..15 -> CH1..8, Port A = 0..7 -> CH9..16)
switch:
  - { platform: gpio, name: "Relay 1",  pin: { mcp23xxx: relay_mod1, number: 8,  mode: OUTPUT }, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: gpio, name: "Relay 2",  pin: { mcp23xxx: relay_mod1, number: 9,  mode: OUTPUT }, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: gpio, name: "Relay 3",  pin: { mcp23xxx: relay_mod1, number: 10, mode: OUTPUT }, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: gpio, name: "Relay 4",  pin: { mcp23xxx: relay_mod1, number: 11, mode: OUTPUT }, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: gpio, name: "Relay 5",  pin: { mcp23xxx: relay_mod1, number: 12, mode: OUTPUT }, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: gpio, name: "Relay 6",  pin: { mcp23xxx: relay_mod1, number: 13, mode: OUTPUT }, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: gpio, name: "Relay 7",  pin: { mcp23xxx: relay_mod1, number: 14, mode: OUTPUT }, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: gpio, name: "Relay 8",  pin: { mcp23xxx: relay_mod1, number: 15, mode: OUTPUT }, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: gpio, name: "Relay 9",  pin: { mcp23xxx: relay_mod1, number: 0,  mode: OUTPUT }, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: gpio, name: "Relay 10", pin: { mcp23xxx: relay_mod1, number: 1,  mode: OUTPUT }, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: gpio, name: "Relay 11", pin: { mcp23xxx: relay_mod1, number: 2,  mode: OUTPUT }, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: gpio, name: "Relay 12", pin: { mcp23xxx: relay_mod1, number: 3,  mode: OUTPUT }, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: gpio, name: "Relay 13", pin: { mcp23xxx: relay_mod1, number: 4,  mode: OUTPUT }, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: gpio, name: "Relay 14", pin: { mcp23xxx: relay_mod1, number: 5,  mode: OUTPUT }, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: gpio, name: "Relay 15", pin: { mcp23xxx: relay_mod1, number: 6,  mode: OUTPUT }, restore_mode: RESTORE_DEFAULT_OFF }
  - { platform: gpio, name: "Relay 16", pin: { mcp23xxx: relay_mod1, number: 7,  mode: OUTPUT }, restore_mode: RESTORE_DEFAULT_OFF }

# 12-Channel Opto-Isolated Digital Inputs on KEAVY-INPUT12A4 (0x24, Active-Low w/ internal pull-up)
# GPB0..7 (8..15) = DI1..DI8 | GPA0..3 (0..3) = DI9..DI12
binary_sensor:
  - { platform: gpio, name: "Digital Input 1",  pin: { mcp23xxx: input_mod1, number: 8,  mode: INPUT_PULLUP, inverted: true }, filters: [{ delayed_on_off: 20ms }] }
  - { platform: gpio, name: "Digital Input 2",  pin: { mcp23xxx: input_mod1, number: 9,  mode: INPUT_PULLUP, inverted: true }, filters: [{ delayed_on_off: 20ms }] }
  - { platform: gpio, name: "Digital Input 3",  pin: { mcp23xxx: input_mod1, number: 10, mode: INPUT_PULLUP, inverted: true }, filters: [{ delayed_on_off: 20ms }] }
  - { platform: gpio, name: "Digital Input 4",  pin: { mcp23xxx: input_mod1, number: 11, mode: INPUT_PULLUP, inverted: true }, filters: [{ delayed_on_off: 20ms }] }
  - { platform: gpio, name: "Digital Input 5",  pin: { mcp23xxx: input_mod1, number: 12, mode: INPUT_PULLUP, inverted: true }, filters: [{ delayed_on_off: 20ms }] }
  - { platform: gpio, name: "Digital Input 6",  pin: { mcp23xxx: input_mod1, number: 13, mode: INPUT_PULLUP, inverted: true }, filters: [{ delayed_on_off: 20ms }] }
  - { platform: gpio, name: "Digital Input 7",  pin: { mcp23xxx: input_mod1, number: 14, mode: INPUT_PULLUP, inverted: true }, filters: [{ delayed_on_off: 20ms }] }
  - { platform: gpio, name: "Digital Input 8",  pin: { mcp23xxx: input_mod1, number: 15, mode: INPUT_PULLUP, inverted: true }, filters: [{ delayed_on_off: 20ms }] }
  - { platform: gpio, name: "Digital Input 9",  pin: { mcp23xxx: input_mod1, number: 0,  mode: INPUT_PULLUP, inverted: true }, filters: [{ delayed_on_off: 20ms }] }
  - { platform: gpio, name: "Digital Input 10", pin: { mcp23xxx: input_mod1, number: 1,  mode: INPUT_PULLUP, inverted: true }, filters: [{ delayed_on_off: 20ms }] }
  - { platform: gpio, name: "Digital Input 11", pin: { mcp23xxx: input_mod1, number: 2,  mode: INPUT_PULLUP, inverted: true }, filters: [{ delayed_on_off: 20ms }] }
  - { platform: gpio, name: "Digital Input 12", pin: { mcp23xxx: input_mod1, number: 3,  mode: INPUT_PULLUP, inverted: true }, filters: [{ delayed_on_off: 20ms }] }

# 4-Channel 16-Bit 0-10V Analog Inputs on KEAVY-INPUT12A4 (ADS1115 0x48, 22k/10k divider -> multiply by 3.2)
sensor:
  - { platform: ads1115, ads1115_id: adc_mod1, multiplexer: 'A0_GND', gain: 4.096, name: "Analog Input 1 (0-10V)", unit_of_measurement: "V", update_interval: 2s, filters: [{ multiply: 3.2 }] }
  - { platform: ads1115, ads1115_id: adc_mod1, multiplexer: 'A1_GND', gain: 4.096, name: "Analog Input 2 (0-10V)", unit_of_measurement: "V", update_interval: 2s, filters: [{ multiply: 3.2 }] }
  - { platform: ads1115, ads1115_id: adc_mod1, multiplexer: 'A2_GND', gain: 4.096, name: "Analog Input 3 (0-10V)", unit_of_measurement: "V", update_interval: 2s, filters: [{ multiply: 3.2 }] }
  - { platform: ads1115, ads1115_id: adc_mod1, multiplexer: 'A3_GND', gain: 4.096, name: "Analog Input 4 (0-10V)", unit_of_measurement: "V", update_interval: 2s, filters: [{ multiply: 3.2 }] }
